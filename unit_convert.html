<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mechhub - 단위 환산 (Unit Converter)</title>
    <link rel="stylesheet" href="common.css">
    <script src="sidebar.js"></script>
    <style>
        .uc-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 900px) { .uc-layout { grid-template-columns: 1fr; } }
        .cat-list { display: flex; flex-direction: column; gap: 6px; }
        .cat-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 6px; font-size: 13px; font-weight: 700; color: #64748b; cursor: pointer; text-align: left; transition: all 0.15s; }
        .cat-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .cat-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        #uResultTable tbody tr { cursor: pointer; }
        #uResultTable tbody tr.row-active td { font-weight: 700; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-scroll">
            <div class="sidebar-brand"><h1>mechhub</h1><span>기구설계 보조 포털 v1.0</span></div>
            <ul class="sidebar-menu" id="sidebarMenu"></ul>
        </div>
        <div class="sidebar-footer"><p>© 2026 장비설계팀 Asset</p></div>
    </div>

    <div class="main-content">
        <div class="main-header">
            <h2>8. 요소설계 & 계산 📐 단위 환산 (Unit Converter)</h2>
        </div>
        <div class="content-body">

            <div class="uc-layout">
                <div class="card">
                    <h3>환산 카테고리</h3>
                    <div class="cat-list" id="catList"></div>
                </div>

                <div class="card">
                    <h3 id="uCatTitle">길이 (Length)</h3>
                    <p class="card-note">기준 단위와 값을 입력하면 나머지 단위로 실시간 환산됩니다. 표의 행을 클릭하면 해당 단위를 기준(값 1)으로 바로 전환합니다.</p>

                    <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px;">
                        <div class="input-group" style="flex:1; min-width:160px; margin-bottom:0;">
                            <label>변환 전 값</label>
                            <div class="input-wrapper"><input type="number" id="uInput" value="1" oninput="calcUnit()"></div>
                        </div>
                        <div class="input-group" style="flex:1; min-width:160px; margin-bottom:0;">
                            <label>기준 단위</label>
                            <div class="input-wrapper"><select id="uBaseUnit" onchange="calcUnit()"></select></div>
                        </div>
                    </div>

                    <table class="data-table" id="uResultTable">
                        <thead><tr><th style="width:50px;">No</th><th>단위</th><th>환산 결과값</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ========== 카테고리 & 단위 정의 (SI 기본단위 기준 factor, 온도는 별도 처리) ==========
        const categories = {
            length: { label:'길이 (Length)', icon:'📏', units:[
                { key:'nm', label:'nm', factor:1e-9 },
                { key:'um', label:'μm', factor:1e-6 },
                { key:'mm', label:'mm', factor:1e-3 },
                { key:'cm', label:'cm', factor:1e-2 },
                { key:'m', label:'m', factor:1 },
                { key:'km', label:'km', factor:1e3 },
                { key:'in', label:'in (inch)', factor:0.0254 },
                { key:'ft', label:'ft (feet)', factor:0.3048 },
                { key:'yd', label:'yd (yard)', factor:0.9144 },
                { key:'mile', label:'mile', factor:1609.344 },
                { key:'mil', label:'mil (thou)', factor:0.0000254 },
            ]},
            area: { label:'면적 (Area)', icon:'◻️', units:[
                { key:'mm2', label:'mm²', factor:1e-6 },
                { key:'cm2', label:'cm²', factor:1e-4 },
                { key:'m2', label:'m²', factor:1 },
                { key:'km2', label:'km²', factor:1e6 },
                { key:'in2', label:'in²', factor:0.00064516 },
                { key:'ft2', label:'ft²', factor:0.09290304 },
                { key:'yd2', label:'yd²', factor:0.83612736 },
                { key:'acre', label:'acre', factor:4046.8564224 },
            ]},
            volume: { label:'체적 (Volume)', icon:'🧊', units:[
                { key:'mm3', label:'mm³', factor:1e-9 },
                { key:'cm3', label:'cm³ (mL)', factor:1e-6 },
                { key:'L', label:'L (liter)', factor:1e-3 },
                { key:'m3', label:'m³', factor:1 },
                { key:'in3', label:'in³', factor:0.000016387064 },
                { key:'ft3', label:'ft³', factor:0.028316846592 },
                { key:'galUS', label:'gal (US)', factor:0.003785411784 },
                { key:'galUK', label:'gal (UK)', factor:0.00454609 },
            ]},
            mass: { label:'질량 (Mass)', icon:'⚖️', units:[
                { key:'mg', label:'mg', factor:1e-6 },
                { key:'g', label:'g', factor:1e-3 },
                { key:'kg', label:'kg', factor:1 },
                { key:'ton', label:'ton (metric)', factor:1000 },
                { key:'lb', label:'lb (pound)', factor:0.45359237 },
                { key:'oz', label:'oz (ounce)', factor:0.028349523125 },
            ]},
            force: { label:'힘 (Force)', icon:'💪', units:[
                { key:'N', label:'N', factor:1 },
                { key:'kN', label:'kN', factor:1000 },
                { key:'kgf', label:'kgf', factor:9.80665 },
                { key:'lbf', label:'lbf', factor:4.4482216153 },
                { key:'dyne', label:'dyne', factor:1e-5 },
            ]},
            pressure: { label:'압력 (Pressure)', icon:'🌡️', units:[
                { key:'Pa', label:'Pa', factor:1 },
                { key:'kPa', label:'kPa', factor:1000 },
                { key:'MPa', label:'MPa', factor:1e6 },
                { key:'bar', label:'bar', factor:1e5 },
                { key:'atm', label:'atm', factor:101325 },
                { key:'kgfcm2', label:'kgf/cm²', factor:98066.5 },
                { key:'psi', label:'psi', factor:6894.757293168 },
                { key:'mmHg', label:'mmHg', factor:133.322387415 },
                { key:'mmH2O', label:'mmH₂O', factor:9.80665 },
            ]},
            torque: { label:'토크 (Torque)', icon:'🔧', units:[
                { key:'Nm', label:'N·m', factor:1 },
                { key:'Nmm', label:'N·mm', factor:0.001 },
                { key:'kgfcm', label:'kgf·cm', factor:0.0980665 },
                { key:'kgfm', label:'kgf·m', factor:9.80665 },
                { key:'lbfft', label:'lbf·ft', factor:1.3558179483 },
                { key:'lbfin', label:'lbf·in', factor:0.1129848290 },
            ]},
            temp: { label:'온도 (Temperature)', icon:'🌡', special:'temp', units:[
                { key:'C', label:'°C' },
                { key:'F', label:'°F' },
                { key:'K', label:'K' },
            ]},
            speed: { label:'속도 (Speed)', icon:'🚀', units:[
                { key:'mms', label:'mm/s', factor:0.001 },
                { key:'mmmin', label:'mm/min', factor:0.001/60 },
                { key:'ms', label:'m/s', factor:1 },
                { key:'mmin', label:'m/min', factor:1/60 },
                { key:'kmh', label:'km/h', factor:1/3.6 },
                { key:'ins', label:'in/s', factor:0.0254 },
                { key:'fts', label:'ft/s', factor:0.3048 },
                { key:'ftmin', label:'ft/min', factor:0.3048/60 },
                { key:'mph', label:'mph', factor:0.44704 },
            ]},
            angle: { label:'각도 (Angle)', icon:'📐', units:[
                { key:'deg', label:'° (degree)', factor:Math.PI/180 },
                { key:'rad', label:'rad', factor:1 },
                { key:'grad', label:'grad', factor:Math.PI/200 },
                { key:'rev', label:'rev (회전)', factor:2*Math.PI },
            ]},
            power: { label:'동력 (Power)', icon:'⚡', units:[
                { key:'W', label:'W', factor:1 },
                { key:'kW', label:'kW', factor:1000 },
                { key:'PS', label:'PS (미터마력)', factor:735.49875 },
                { key:'HP', label:'HP (영국마력)', factor:745.6998716 },
                { key:'kgfms', label:'kgf·m/s', factor:9.80665 },
                { key:'kcalh', label:'kcal/h', factor:1.163 },
            ]},
            density: { label:'밀도 (Density)', icon:'🧪', units:[
                { key:'kgm3', label:'kg/m³', factor:1 },
                { key:'gcm3', label:'g/cm³', factor:1000 },
                { key:'gml', label:'g/mL', factor:1000 },
                { key:'kgL', label:'kg/L', factor:1000 },
                { key:'lbft3', label:'lb/ft³', factor:16.018463374 },
                { key:'lbin3', label:'lb/in³', factor:27679.904710 },
            ]},
        };

        let currentCat = 'length';

        function fmtNum(v) {
            if (v === null || v === undefined || !isFinite(v)) return '-';
            if (v === 0) return '0';
            const abs = Math.abs(v);
            if (abs >= 1e9 || abs < 1e-6) {
                let s = v.toExponential(6).replace(/(\.\d*?)0+e/, '$1e').replace(/\.e/, 'e');
                return s.replace('e', 'E');
            }
            let s = v.toPrecision(7);
            if (s.indexOf('e') >= 0 || s.indexOf('E') >= 0) return v.toExponential(6).replace('e', 'E');
            if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
            return s;
        }

        function toCelsius(key, v) {
            if (key === 'C') return v;
            if (key === 'F') return (v - 32) * 5 / 9;
            if (key === 'K') return v - 273.15;
        }
        function fromCelsius(key, c) {
            if (key === 'C') return c;
            if (key === 'F') return c * 9 / 5 + 32;
            if (key === 'K') return c + 273.15;
        }

        function renderCatList() {
            const wrap = document.getElementById('catList');
            wrap.innerHTML = Object.keys(categories).map(key => {
                const c = categories[key];
                return `<button type="button" class="cat-btn${key === currentCat ? ' active' : ''}" data-key="${key}" onclick="switchCategory('${key}')">${c.icon} ${c.label}</button>`;
            }).join('');
        }

        function switchCategory(key) {
            currentCat = key;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
            document.getElementById('uCatTitle').textContent = categories[key].label;
            document.getElementById('uInput').value = 1;
            populateUnitSelect();
            calcUnit();
        }

        function populateUnitSelect() {
            const sel = document.getElementById('uBaseUnit');
            sel.innerHTML = categories[currentCat].units.map(u => `<option value="${u.key}">${u.label}</option>`).join('');
        }

        function selectUnitFromTable(key) {
            document.getElementById('uBaseUnit').value = key;
            document.getElementById('uInput').value = 1;
            calcUnit();
        }

        function calcUnit() {
            const cat = categories[currentCat];
            const val = parseFloat(document.getElementById('uInput').value);
            const unitKey = document.getElementById('uBaseUnit').value;
            const tbody = document.querySelector('#uResultTable tbody');

            let results;
            if (!isFinite(val)) {
                results = cat.units.map(() => null);
            } else if (cat.special === 'temp') {
                const c = toCelsius(unitKey, val);
                results = cat.units.map(u => fromCelsius(u.key, c));
            } else {
                const base = cat.units.find(u => u.key === unitKey);
                const baseVal = val * base.factor;
                results = cat.units.map(u => baseVal / u.factor);
            }

            tbody.innerHTML = cat.units.map((u, i) => `
                <tr class="${u.key === unitKey ? 'row-active' : ''}" onclick="selectUnitFromTable('${u.key}')">
                    <td>${i + 1}</td>
                    <td>${u.label}</td>
                    <td>${fmtNum(results[i])}</td>
                </tr>`).join('');
        }


        window.onload = function () {
            renderSidebar('mecha');
            renderCatList();
            populateUnitSelect();
            calcUnit();
        };
    </script>
</body>
</html>
